name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast feedback: the snapshot tests are plain Ruby, so run them under CRuby.
  cruby:
    name: Snapshot test (CRuby)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
      - name: Diff transcripts against snapshots
        run: |
          set -uo pipefail
          status=0
          for f in test/*_test.rb; do
            ruby "$f" | diff -u "$f.expected" - || status=1
          done
          exit $status

  # Compile with Spinel and check what CRuby cannot see: `spin test`, the
  # static type-health check, the shipped binary run over a fixture, and the
  # emitted types. Spinel is not packaged, so it is built from source.
  spinel:
    name: Compiled test (Spinel)
    runs-on: ubuntu-latest
    env:
      # The source of truth for the pinned Spinel revision. The SessionStart hook
      # and Formula/spinel.rb repeat it, and the first step fails if they disagree:
      # a comment alone did not keep them in step.
      #
      # Before bumping, run the golden check AND the compiled-binary fixture
      # against the candidate. The fixture is the only check that saw the
      # bf4816ed segfault; the golden, `spin test` and doctor were all green on
      # the build that crashed. The history of each bump -- what widened, what
      # was pinned back, what it bought -- belongs in that bump's commit message.
      SPINEL_REF: a3be2abdc09c3d5fa7094948baa7ce4d40dbb397
      SPINEL_REPO: https://github.com/matz/spinel.git
      SPINEL_PREFIX: ${{ github.workspace }}/.spinel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version

      # Checked before the expensive build, so a half-finished bump fails in
      # seconds. Formula/spinel.rb derives its `version` from REVISION, so
      # matching REVISION covers that string too.
      - name: Check the pinned revision agrees everywhere
        run: |
          set -euo pipefail
          grep -q "SPINEL_REF:-$SPINEL_REF}" .claude/hooks/session-start.sh
          grep -q "REVISION = \"$SPINEL_REF\"" Formula/spinel.rb

      # Restore and save are split rather than using the combined `actions/cache`,
      # which saves only on `success()`. A bump invalidates the key, and the
      # checks right after one are the likeliest to fail, so a red run would
      # discard the fresh compiler and rebuild it on every retry. (`save-always`
      # is documented as deprecated and non-working, pointing at this split.)
      - name: Restore Spinel install
        id: cache-spinel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPINEL_PREFIX }}
          key: spinel-${{ runner.os }}-${{ env.SPINEL_REF }}

      - name: Build & install Spinel
        if: steps.cache-spinel.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/spinel-src"
          git init -q "$src"
          git -C "$src" remote add origin "$SPINEL_REPO"
          git -C "$src" fetch -q --depth 1 origin "$SPINEL_REF"
          git -C "$src" checkout -q FETCH_HEAD
          make -C "$src" deps
          make -C "$src"
          make -C "$src" install PREFIX="$SPINEL_PREFIX"

      - name: Save Spinel install
        if: steps.cache-spinel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPINEL_PREFIX }}
          key: spinel-${{ runner.os }}-${{ env.SPINEL_REF }}

      - name: Run spin test
        run: |
          echo "$SPINEL_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$SPINEL_PREFIX/bin:$PATH"
          spin --version
          spin test

      # spinel-doctor flags a method the Spinel runtime cannot dispatch on an
      # untyped receiver (Array#sort and its poly-array siblings) from a compile
      # pass, without a fixture having to walk that path. It is not a substitute
      # for the golden check below: widening to untyped is only info severity
      # here and never fails. The test files are checked too, since `spin test`
      # compiles them with Spinel.
      #
      # The guard turns a ref that stops shipping doctor into a failure rather
      # than a skipped "command not found".
      - name: Type-health check (spinel-doctor)
        run: |
          command -v spinel-doctor >/dev/null || {
            echo "spinel-doctor not on PATH: the pinned Spinel build no longer ships it (see SPINEL_REF)" >&2
            exit 1
          }
          spinel-doctor bin/git-stack.rb
          for f in test/*_test.rb; do
            spinel-doctor "$f"
          done

      # Neither `spin test` (whose harness runs `ruby bin/git-stack.rb`) nor the
      # cruby job ever executes the compiled binary; see test/binary_test.sh for
      # what only it can catch.
      - name: Run compiled binary against fixture
        run: |
          spin build
          test/binary_test.sh | diff -u test/binary_test.sh.expected -

      # The committed output of `spinel --emit-rbs` with the same `--rbs rbs/` seed
      # `spin build` uses, so it shows the types the shipped binary is compiled
      # with. After an intended type change, refresh it with:
      #
      #   spinel --emit-rbs --rbs rbs/ bin/git-stack.rb --output=test/git-stack.rbs.expected
      #
      # It lives in test/, never under rbs/, where it would seed itself.
      #
      # The numeric suffix of Spinel's per-call-site helpers is masked
      # (`__enum_find__4077` -> `__enum_find__N`): it is a source position, so
      # adding a comment renumbers rows without a type moving. Names and
      # signatures are still compared.
      - name: Check emitted RBS against golden file
        run: |
          spinel --emit-rbs --rbs rbs/ bin/git-stack.rb --output=/tmp/emitted.rbs
          mask() { sed -E 's/^(  def __enum_.*__)[0-9]+:/\1N:/' "$1"; }
          diff -u <(mask test/git-stack.rbs.expected) <(mask /tmp/emitted.rbs)

      # The golden diff cannot see the untyped count RISE: an intended type change
      # regenerates the golden, and a regenerated file matches itself. So the
      # ceiling is a literal a regeneration does not touch. Lower it in the commit
      # that narrows types; raising it has to be a reviewable line in the diff.
      #
      # Only the classes this repo writes are counted. Rows in the classes Spinel
      # injects for a `require` are upstream's and cannot be narrowed here, so
      # counting them left raising the ceiling as the only remedy for a bump --
      # the reflex this step exists to stop. They are still compared in the
      # golden diff above.
      #
      # An injected class missing from SPINEL_CLASSES counts as ours and fails, so
      # a new `require` lands as a considered line rather than a hole. The same
      # holds for the `__`-prefixed helpers Spinel injects into `class Object`,
      # which is only safe while no `__` method is ours -- hence the check first.
      - name: Check the untyped ratchet has not risen
        run: |
          RATCHET=0
          SPINEL_CLASSES="OptionParser ParseError Set"
          if grep -nE '^[[:space:]]*def (self\.)?__' bin/git-stack.rb; then
            echo "bin/git-stack.rb defines a __-prefixed method; the ratchet reads those as Spinel's own." >&2
            echo "Rename it rather than letting it hide from the count." >&2
            exit 1
          fi
          report="$(awk -v skip="$SPINEL_CLASSES" '
            BEGIN { n = split(skip, a, " "); for (i = 1; i <= n; i++) injected[a[i]] = 1 }
            /^class / { cls = $2 }
            /untyped/ {
              c = (cls == "" ? "(toplevel)" : cls)
              if ($1 == "def" && $2 ~ /^(self\.)?__/) { c = c "#__"; injected[c] = 1 }
              count[c]++
            }
            END {
              for (c in count) {
                printf "%s\t%s\t%d\n", (c in injected ? "spinel" : "ours"), c, count[c]
              }
            }
          ' test/git-stack.rbs.expected | sort)"
          printf '%s\n' "$report" | while IFS="$(printf '\t')" read -r side cls n; do
            printf '  %-7s %-16s %s untyped\n' "$side" "$cls" "$n"
          done
          count="$(printf '%s\n' "$report" | awk -F'\t' '$1 == "ours" { n += $3 } END { print n + 0 }')"
          echo "untyped signatures in this repo's classes: $count (ceiling: $RATCHET)"
          if [ "$count" -gt "$RATCHET" ]; then
            echo "type regression: our classes gained $((count - RATCHET)) untyped signature(s)." >&2
            echo "Find where the widening starts (an ivar or a poly-array receiver) rather than raising RATCHET." >&2
            echo "If the growth is in a class Spinel injects for a require, add it to SPINEL_CLASSES instead." >&2
            exit 1
          fi
